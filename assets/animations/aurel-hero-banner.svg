<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="AUREL Beyond Connection Animated Hero Banner">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061638"/>
      <stop offset="52%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.76" cy="0.50" r="0.45">
      <stop offset="0%" stop-color="#0866FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#0047C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080E1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2286FF"/>
      <stop offset="100%" stop-color="#0047C7"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3050" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#111B2C" stop-opacity="0.76"/>
    </linearGradient>
    <path id="pChats" d="M 156 87 C 210 87, 232 142, 266 172"/>
    <path id="pClips" d="M 156 291 C 210 291, 232 238, 266 208"/>
    <path id="pSocial" d="M 464 87 C 410 87, 388 142, 354 172"/>
    <path id="pSpaces" d="M 464 291 C 410 291, 388 238, 354 208"/>
    <path id="pGlass" d="M 310 50 L 310 132"/>
  </defs>

  <rect width="1280" height="440" rx="28" fill="url(#heroBg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#halo)"/>
  <rect x="1" y="1" width="1278" height="438" rx="27" fill="none" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Left Identity Column -->
  <rect x="56" y="54" width="64" height="64" rx="18" fill="url(#iconGrad)" stroke="#9BCBFF" stroke-opacity="0.65" stroke-width="1.4"/>
  <path d="M 74 100 L 88 70 L 102 100 M 79 90 Q 88 86 97 90" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="136" y="70" width="248" height="32" rx="16" fill="#18263C" fill-opacity="0.82" stroke="#9BCBFF" stroke-opacity="0.35" stroke-width="1"/>
  <text x="260" y="90" text-anchor="middle" fill="#9BCBFF" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1">IOS PRODUCT DESIGN CONCEPT</text>

  <text x="54" y="198" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Avenir Next', sans-serif" font-size="68" font-weight="700" letter-spacing="4">AUREL</text>
  <text x="56" y="238" fill="#9BCBFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Avenir Next', sans-serif" font-size="25" font-weight="600">Beyond Connection.</text>
  <text x="56" y="276" fill="#DCEBFF" fill-opacity="0.88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16">Connect with people. Discover more. Think together.</text>
  <text x="56" y="302" fill="#9FB0C9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">Messaging, editorial social, short cinema, spaces, and opt-in intelligence in Liquid Glass.</text>

  <rect x="56" y="346" width="388" height="44" rx="22" fill="#111B2C" fill-opacity="0.85" stroke="#253550" stroke-width="1"/>
  <text x="76" y="373" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">NGOPREK DIGITAL</text>
  <text x="214" y="373" fill="#9BCBFF" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">· Connect. Collaborate. Create.</text>

  <!-- Right Animated Connection Network -->
  <g transform="translate(650, 30)">
    <circle cx="310" cy="190" r="148" fill="none" stroke="#3B82F6" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="5 7">
      <animateTransform attributeName="transform" type="rotate" from="0 310 190" to="360 310 190" dur="48s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="190" r="96" fill="none" stroke="#9BCBFF" stroke-opacity="0.24" stroke-width="1.2">
      <animate attributeName="r" values="92;100;92" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.16;0.34;0.16" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Base connection tracks -->
    <use href="#pChats" fill="none" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2"/>
    <use href="#pClips" fill="none" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2"/>
    <use href="#pSocial" fill="none" stroke="#9BCBFF" stroke-opacity="0.45" stroke-width="2"/>
    <use href="#pSpaces" fill="none" stroke="#9BCBFF" stroke-opacity="0.45" stroke-width="2"/>
    <use href="#pGlass" fill="none" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2"/>

    <!-- Travelling signal pulses -->
    <circle r="4" fill="#9BCBFF">
      <animateMotion dur="3.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#pChats"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#3B82F6">
      <animateMotion dur="3.8s" begin="0.8s" repeatCount="indefinite"><mpath href="#pSocial"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#9BCBFF">
      <animateMotion dur="4.0s" begin="1.4s" repeatCount="indefinite"><mpath href="#pClips"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.0s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#DCEBFF">
      <animateMotion dur="3.6s" begin="2.1s" repeatCount="indefinite"><mpath href="#pSpaces"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#9BCBFF">
      <animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#pGlass"/></animateMotion>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Central Aurel Emblem -->
    <circle cx="310" cy="190" r="64" fill="#0866FF" fill-opacity="0.14">
      <animate attributeName="r" values="60;68;60" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="190" r="54" fill="url(#iconGrad)" stroke="#9BCBFF" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M 294 202 L 310 168 L 326 202 M 299 192 Q 310 188 321 192" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="224" text-anchor="middle" fill="#DCEBFF" font-family="'SF Mono', ui-monospace, monospace" font-size="9" font-weight="700">OPT-IN AI</text>

    <!-- 5 Glass Nodes -->
    <rect x="24" y="64" width="132" height="46" rx="23" fill="url(#glassCard)" stroke="#9BCBFF" stroke-opacity="0.42" stroke-width="1.2"/>
    <text x="90" y="92" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Aurel Chats</text>

    <rect x="24" y="268" width="132" height="46" rx="23" fill="url(#glassCard)" stroke="#9BCBFF" stroke-opacity="0.42" stroke-width="1.2"/>
    <text x="90" y="296" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Aurel Clips</text>

    <rect x="464" y="64" width="132" height="46" rx="23" fill="url(#glassCard)" stroke="#9BCBFF" stroke-opacity="0.42" stroke-width="1.2"/>
    <text x="530" y="92" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Aurel Social</text>

    <rect x="464" y="268" width="132" height="46" rx="23" fill="url(#glassCard)" stroke="#9BCBFF" stroke-opacity="0.42" stroke-width="1.2"/>
    <text x="530" y="296" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Aurel Spaces</text>

    <rect x="234" y="10" width="152" height="40" rx="20" fill="url(#glassCard)" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="310" y="34" text-anchor="middle" fill="#DCEBFF" font-family="'SF Mono', ui-monospace, monospace" font-size="11" font-weight="600">LIQUID GLASS UI</text>
  </g>
</svg>
