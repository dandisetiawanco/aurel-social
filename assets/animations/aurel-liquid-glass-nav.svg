<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="AUREL Liquid Glass Floating Navigation Concept Animation">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF2FF"/>
      <stop offset="50%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="glassShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0866FF" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="920" height="240" rx="24" fill="url(#stage)" stroke="#DCEBFF" stroke-width="1.5"/>
  <text x="36" y="42" fill="#0866FF" font-family="'SF Mono', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">CONCEPTUAL MOTION · LIQUID GLASS NAVIGATION CAPSULE (180 - 220 MS SPRING GLIDE)</text>
  <text x="36" y="66" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">Concentric 32px Outer Capsule · 24px Crystal Blue Active Selection</text>

  <!-- Subtle architectural backdrop waves behind the glass bar -->
  <rect x="110" y="96" width="700" height="106" rx="22" fill="#DCEBFF" fill-opacity="0.55"/>
  <circle cx="240" cy="148" r="38" fill="#0866FF" fill-opacity="0.16"/>
  <circle cx="460" cy="148" r="44" fill="#007AFF" fill-opacity="0.14"/>
  <circle cx="680" cy="148" r="36" fill="#0047C7" fill-opacity="0.15"/>

  <!-- Floating Liquid Glass 5-Tab Bar -->
  <g transform="translate(150, 112)" filter="url(#softShadow)">
    <rect width="620" height="76" rx="38" fill="url(#glassShell)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="1" y="1" width="618" height="74" rx="37" fill="none" stroke="#9BCBFF" stroke-opacity="0.55" stroke-width="1"/>

    <!-- Gliding Crystal Blue Active Pill -->
    <rect y="10" width="114" height="56" rx="28" fill="#DCEBFF" stroke="#9BCBFF" stroke-width="1.4">
      <animate attributeName="x" values="10;10;132;132;254;254;376;376;496;496;10" keyTimes="0;0.14;0.20;0.34;0.40;0.54;0.60;0.74;0.80;0.94;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- 5 Tab Labels -->
    <text x="67" y="43" text-anchor="middle" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Chats</text>
    <text x="189" y="43" text-anchor="middle" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Social</text>
    <text x="311" y="43" text-anchor="middle" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Clips</text>
    <text x="433" y="43" text-anchor="middle" fill="#0866FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Aurel AI</text>
    <text x="553" y="43" text-anchor="middle" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Spaces</text>
  </g>
</svg>
