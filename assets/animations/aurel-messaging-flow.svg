<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-label="AUREL Messaging Flow Concept Animation">
  <rect width="920" height="280" rx="24" fill="#F7FAFF" stroke="#E0E7F0" stroke-width="1.5"/>
  <text x="36" y="38" fill="#0866FF" font-family="'SF Mono', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">CONCEPTUAL MOTION · MESSAGING DELIVERY, REACTIONS &amp; OPT-IN AI ASSIST</text>
  <text x="36" y="62" fill="#101828" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="700">120 - 180 ms Delivery &amp; Reaction Feedback · Clean Pure White Reading Surface</text>

  <!-- Incoming Message -->
  <g transform="translate(36, 86)">
    <circle cx="20" cy="24" r="20" fill="#DCEBFF" stroke="#0866FF" stroke-width="1.5"/>
    <text x="20" y="29" text-anchor="middle" fill="#0866FF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">NK</text>
    <rect x="52" y="2" width="386" height="54" rx="20" fill="#FFFFFF" stroke="#E0E7F0" stroke-width="1.2"/>
    <text x="70" y="25" fill="#101828" font-family="-apple-system, sans-serif" font-size="13">Can we move tomorrow's Kyoto layout critique to 2 PM?</text>
    <text x="70" y="44" fill="#52627A" font-family="'SF Mono', ui-monospace, monospace" font-size="10">09:38 · NADIA KUSUMA</text>
  </g>

  <!-- Outgoing Animated Reply -->
  <g transform="translate(468, 134)">
    <rect width="416" height="62" rx="20" fill="#0866FF">
      <animate attributeName="opacity" values="0.2;1;1;1;0.2" keyTimes="0;0.18;0.78;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">2 PM works great! Reviewing the glass pavilion study now.</text>
    <text x="18" y="47" fill="#DCEBFF" font-family="'SF Mono', ui-monospace, monospace" font-size="10" font-weight="700">09:40 · DELIVERED ✓ -&gt; READ ✓✓</text>
    <circle cx="394" cy="43" r="4.5" fill="#9BCBFF">
      <animate attributeName="opacity" values="0.2;1;1;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Reaction Pill Pop -->
  <g transform="translate(768, 198)">
    <rect width="112" height="28" rx="14" fill="#FFFFFF" stroke="#9BCBFF" stroke-width="1.4">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.44;0.88;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="56" y="18" text-anchor="middle" fill="#0866FF" font-family="'SF Mono', ui-monospace, monospace" font-size="10" font-weight="700">
      +1 APPROVED
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.44;0.88;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Opt-In AI Suggestion Cue -->
  <g transform="translate(36, 206)">
    <rect width="412" height="44" rx="22" fill="#DCEBFF" fill-opacity="0.72" stroke="#9BCBFF" stroke-width="1.2"/>
    <circle cx="24" cy="22" r="10" fill="#0866FF"/>
    <text x="24" y="26" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">A</text>
    <text x="44" y="26" fill="#0866FF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Aurel Reply Assist · Opt-In Draft (Never Auto-Sends)</text>
  </g>
</svg>
